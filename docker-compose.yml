version: "3.9"

services:
  api:
    build: .
    container_name: mabdel-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app

  worker:
    build: .
    container_name: mabdel-worker
    command: ["arq", "app.infrastructure.queue.worker.WorkerSettings"]
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app

  mongo:
    image: mongo:7
    container_name: mabdel-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: mabdel-redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:

